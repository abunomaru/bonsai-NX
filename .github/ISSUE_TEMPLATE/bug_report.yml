name: Bug report
description: Something in Bonsai crashes, freezes or does not work as it should
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Bonsai! It is a **VERY experimental** alpha, so every report with logs helps.

        Before you start:
        - Reports about pirated keys, firmware or games are closed without an answer.
        - If the bug also happens in [Jadyx](https://github.com/JulianDr14/jadyx) with a Switch 1 game, it may be Jadyx's: say so below.
        - For "does game X work?" use the **Game report** form instead.
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      options:
        - label: I have searched the existing issues
          required: true
  - type: input
    id: version
    attributes:
      label: Bonsai version
      description: Shown in the corner of the game library, or the CI run / release you installed (e.g. 0.3.12.1033 or v0.1.0-alpha).
      placeholder: 0.3.12.1033
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Crash or freeze in a game
        - Graphics (glitches, missing or wrong surfaces, text)
        - Audio
        - Performance
        - Memory (out of memory, app closes)
        - Menus and library
        - Importing games, keys, firmware (Portal, USB)
        - Install, update or signing
        - Other
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game
      description: Name and title ID if you know it (Switch 2 IDs start with 04). Leave empty if no game was running.
      placeholder: Pokémon Pokopia (0400…)
  - type: dropdown
    id: format
    attributes:
      label: Game format
      options:
        - Switch 2 .nup
        - Switch 2 raw files (update + RomFS)
        - Switch 1 .nsp / .nsz
        - Switch 1 .xci / .xcz
        - Not a game problem
  - type: dropdown
    id: mode
    attributes:
      label: Docked or handheld
      options:
        - Handheld
        - Docked
        - Both
        - Not a game problem
  - type: dropdown
    id: console
    attributes:
      label: Console
      options:
        - Xbox Series X
        - Xbox Series S
        - PC
    validations:
      required: true
  - type: dropdown
    id: app-type
    attributes:
      label: App type
      description: In Dev Home, select Bonsai → View details → App type. It must be Game; in App mode it runs out of memory.
      options:
        - Game
        - App
        - PC (not applicable)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. A photo or short video of the screen helps a lot.
      placeholder: Got to character creation, then it froze when the world started loading…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest way to make it happen again. Say if it happens every time or only sometimes.
      placeholder: |
        1. Start the game
        2. …
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Take them right after the problem, before launching another game.

        **With the Portal:** Settings → File manager → Network connection → Start server; open the address on your PC or phone, enter the code, and under **Logs and captures** choose **Compress and download logs**. Put the `.tar.zst` in a `.zip` and drag it here (GitHub refuses `.tar.zst`).

        **By hand:** in Device Portal's File explorer, open the app's `LocalState\jadyx\log` folder and attach `jadyx_log.txt`, `jadyx_diag.txt` and, for graphics problems, `jadyx_graphics_bugs.log`.
      placeholder: Drag the .zip or the log files here.
    validations:
      required: true
