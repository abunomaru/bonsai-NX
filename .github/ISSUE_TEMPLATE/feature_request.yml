name: Feature request
description: Suggest something for Bonsai
labels: ["enhancement"]
body:
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      options:
        - label: I have searched the existing issues
          required: true
  - type: textarea
    id: what-feature
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why-feature
    attributes:
      label: Why would it help?
    validations:
      required: true
